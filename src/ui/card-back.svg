<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 88" width="504" height="704" preserveAspectRatio="none">
  <!-- The back of every card, in the CSS (.card-back) and on the 3D table (backTexture): a dark
       field in a gold double rule, and the program's icon (icon.svg) as a gold silhouette, its
       three fanned cards cut apart by the field's colour and the crown cut out of the front
       one. 63 x 88 is a card's size in mm. The width and height only set how sharply the 3D
       table draws it. -->
  <defs>
    <radialGradient id="f" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#232c3d"/>
      <stop offset=".6" stop-color="#121722"/>
      <stop offset="1" stop-color="#080a0f"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dd94"/>
      <stop offset=".5" stop-color="#d2aa42"/>
      <stop offset="1" stop-color="#8a6a2c"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b968"/>
      <stop offset=".5" stop-color="#a8822f"/>
      <stop offset="1" stop-color="#6a501f"/>
    </linearGradient>
    <radialGradient id="h" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d2aa42" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d2aa42" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="63" height="88" fill="url(#f)"/>
  <g fill="none" stroke="#d2aa42">
    <circle cx="31.5" cy="44" r="21" stroke-opacity=".08" stroke-width=".5"/>
    <circle cx="31.5" cy="44" r="27" stroke-opacity=".06" stroke-width=".5"/>
    <circle cx="31.5" cy="44" r="33" stroke-opacity=".045" stroke-width=".5"/>
  </g>
  <rect x="4.2" y="4.2" width="54.6" height="79.6" rx="2.2" fill="none" stroke="url(#g)" stroke-width=".75"/>
  <rect x="6" y="6" width="51" height="76" rx="1.4" fill="none" stroke="#d2aa42" stroke-opacity=".45" stroke-width=".3"/>
  <path d="M31.5 1.9 33.8 4.2 31.5 6.5 29.2 4.2Z M31.5 81.5 33.8 83.8 31.5 86.1 29.2 83.8Z" fill="url(#g)"/>
  <circle cx="31.5" cy="44" r="22" fill="url(#h)"/>
  <!-- The icon's cards and crown, in its own 256-unit square, centred on the card. -->
  <g transform="translate(31.5 45.5) scale(0.175) translate(-128 -128)">
    <g stroke="#0b0e14" stroke-width="7" stroke-linejoin="round">
      <rect x="70" y="45" width="116" height="162" rx="11.6" fill="url(#d)" transform="rotate(-20 128 222)"/>
      <rect x="70" y="45" width="116" height="162" rx="11.6" fill="url(#d)" transform="rotate(20 128 222)"/>
      <rect x="66" y="40" width="124" height="172" rx="12.4" fill="url(#g)"/>
    </g>
    <g fill="#0b0e14" fill-opacity=".9">
      <polygon points="98.56,144.4 93.04,109.44 113.28,126 128,100.24 142.72,126 162.96,109.44 157.44,144.4" stroke="#0b0e14" stroke-opacity=".9" stroke-width="2.76" stroke-linejoin="round"/>
      <circle cx="93.04" cy="109.44" r="5.06"/>
      <circle cx="128" cy="100.24" r="5.06"/>
      <circle cx="162.96" cy="109.44" r="5.06"/>
      <rect x="97.64" y="146.24" width="60.72" height="11.04" rx="2.3"/>
    </g>
  </g>
</svg>
